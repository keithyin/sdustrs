[package]
name = "sdust"
version = "0.1.2"
edition = "2021"
rust-version = "1.70"
description = "Symmetric DUST: low-complexity DNA region masking (Rust port of lh3/sdust)"
license = "MIT"
repository = "https://github.com/keithyin/sdustrs"
readme = "README.md"
keywords = ["bioinformatics", "dna", "low-complexity", "masking", "dust"]
categories = ["science::bioinformatics"]

[lib]
name = "sdust"
path = "src/lib.rs"

[[bin]]
name = "sdust"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] } # 4.5 requires Rust 1.74; keep the 1.70 MSRV
flate2 = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
